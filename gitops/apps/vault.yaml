# Vault, standalone mode with file storage, via the official HashiCorp Helm
# chart (Phase 3, docs/architecture.md "Secrets" layer).
#
# Was dev-mode (server.dev.enabled, in-memory storage) through Phase 7, but
# that lost the Kubernetes auth method and all KV data on 4 separate pod
# restarts across Phases 3/5/6/7 (docs/phase-logs/phase-{3,5,6,7}.md), each
# requiring a manual full re-bootstrap. Switched to standalone mode with the
# `file` storage backend on a local PVC, which persists that data across
# restarts — only a manual `vault operator unseal` is needed afterwards, an
# explicitly accepted trade-off (no auto-unseal/KMS in scope for this lab).
# See docs/adr/022-vault-standalone-file-storage.md for the full
# re-evaluation; this supersedes ONLY docs/adr/006-vault-dev-mode-for-lab.md's
# Decision 1 (dev-mode storage) — Decision 2 (Kubernetes auth method for ESO,
# not a static token) is untouched.
#
# The root token and unseal key shares now come from a one-time `vault
# operator init` (run by scripts/bootstrap-vault.sh) instead of being
# reprinted to the pod's log on every restart. They are cached locally,
# gitignored, in .vault-bootstrap-cache/vault-init.json — never in this file,
# never committed. See scripts/bootstrap-vault.sh and
# scripts/unseal-vault.sh.
#
# injector.enabled is set to false: the Vault Agent Injector (sidecar
# mutating webhook) is a separate feature for injecting secrets into
# arbitrary pods via annotations. This lab only needs External Secrets
# Operator's Vault Kubernetes-auth integration (Phase 3 exit gate), so the
# injector is unused weight — docs/conventions.md: "delete/omit what is not
# used".
#
# Docs consulted:
# - https://developer.hashicorp.com/vault/docs/platform/k8s/helm/configuration
#   (server.standalone, server.dataStorage field reference)
# - https://developer.hashicorp.com/vault/docs/configuration/storage/filesystem
#   (file storage backend: single required `path`, no HA support)
# - https://developer.hashicorp.com/vault/docs/concepts/seal
#   (Shamir seal: vault operator init/unseal flow, taken on deliberately here)
# - `helm show values hashicorp/vault --version 0.34.0` against
#   https://helm.releases.hashicorp.com (confirmed chart defaults: standalone
#   mode's built-in config already sets `storage "file" { path =
#   "/vault/data" }` and `tls_disable = 1`; dataStorage defaults to
#   enabled=true, size=10Gi, mountPath=/vault/data, storageClass=null).
# - https://kind.sigs.k8s.io/docs/user/storage/ (Kind ships
#   local-path-provisioner as the default StorageClass out of the box; no
#   change needed in local/kind/kind-config.yaml).
# - https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
#   (Helm chart repository as an Application source: repoURL + chart +
#   targetRevision, no git repo needed)
# - Chart version 0.34.0 confirmed live via `helm search repo
#   hashicorp/vault --versions` against https://helm.releases.hashicorp.com
#   (added locally, official HashiCorp Helm repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    # Sync wave "0": under root-app's recursive sync of gitops/apps/*, this
    # Application (and its Vault Helm release, incl. CRDs where applicable)
    # must exist before gitops/secrets-demo/ resources (wave "1") that
    # reference the `vault` Service. Waves run lowest-first, each wave
    # waiting for the previous one's resources to be healthy.
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.0
    helm:
      valuesObject:
        server:
          standalone:
            # Explicit true (chart default is the sentinel "-", which
            # resolves to standalone when dev/ha are both disabled) — this
            # repo states modes explicitly rather than relying on an
            # implicit fallback, same style as the prior dev.enabled: true.
            # The chart's built-in standalone config (unmodified here) is
            # `storage "file" { path = "/vault/data" }` +
            # `listener "tcp" { tls_disable = 1 }` — verified via
            # `helm show values`, see the file header for the source.
            enabled: true
          dataStorage:
            # Chart default (enabled: true) — the PVC is what actually
            # fixes the data-loss problem docs/adr/022 addresses.
            enabled: true
            # Reduced from the chart's 10Gi default: this lab's KV data is a
            # handful of short credential strings (Postgres/Redis/RabbitMQ/
            # Kafka/Airflow), not production secret volume. Kind's
            # local-path-provisioner backs PVCs with local host-path
            # storage, so there is no cloud-billing reason to keep 10Gi
            # either way — 1Gi is already generous at this scale.
            size: 1Gi
            # storageClass left at the chart default (null): Kind ships
            # local-path-provisioner as the default StorageClass already
            # (kind.sigs.k8s.io/docs/user/storage/), no need to name it.
          # Requests/limits mandatory per docs/conventions.md. Unchanged from
          # the prior dev-mode sizing — standalone mode with file storage
          # adds no measured extra load at this lab's data volume.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
        injector:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Namespace does not pre-exist; Argo CD creates it (documented sync
      # option, not a manually kubectl-applied namespace).
      - CreateNamespace=true
