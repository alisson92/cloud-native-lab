# External Secrets Operator (ESO), via the official Helm chart
# (Phase 3, docs/architecture.md "Secrets" layer: "Vault -> ESO -> all
# services").
#
# installCRDs defaults to true in the chart already (CRDs: SecretStore,
# ClusterSecretStore, ExternalSecret, ...) — not overridden here, listed
# only for documentation.
#
# Resource requests/limits are set explicitly for the controller, webhook,
# and cert-controller sub-deployments (chart default is `resources: {}` on
# all three) — mandatory per docs/conventions.md. Values are the chart's own
# documented ballpark for a low-traffic dev install, not tuned for load.
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (Helm repo https://charts.external-secrets.io, chart name
#   "external-secrets", namespace convention "external-secrets")
# - https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
#   (Helm chart repository as an Application source)
# - Chart version 2.8.0 (app version v2.8.0) confirmed live via
#   `helm search repo external-secrets/external-secrets --versions`
#   against https://charts.external-secrets.io (official repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Sync wave "0": ESO's CRDs (SecretStore, ExternalSecret, ...) must be
    # installed before gitops/secrets-demo/'s SecretStore/ExternalSecret CRs
    # (wave "1") are applied, otherwise those CRs fail on a fresh cluster
    # (self-heals via Argo CD retry, but avoidable with explicit ordering).
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      valuesObject:
        installCRDs: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        certController:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
