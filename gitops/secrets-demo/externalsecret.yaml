# ExternalSecret: pulls the test key from Vault kv-v2 path "secret/test-secret"
# (written by the one-time bootstrap in README.md, value is the obviously-
# fake placeholder "test-value-not-real" — never a real credential) into a
# Kubernetes Secret named "test-secret", consumed as an env var by
# deployment.yaml.
#
# refreshInterval short (1m) so a live re-sync is quick to observe during
# manual verification; harmless at this scale (single key, dev-mode Vault).
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-secret
  namespace: secrets-demo
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: test-secret
  data:
    - secretKey: TEST_VALUE
      remoteRef:
        key: test-secret
        property: key
