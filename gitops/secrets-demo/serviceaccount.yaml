# ServiceAccount that External Secrets Operator impersonates (via the
# Kubernetes TokenRequest API) to authenticate to Vault's Kubernetes auth
# method. No static Vault token is ever stored in a Kubernetes Secret for
# this flow — see secretstore.yaml and docs/adr/006-vault-dev-mode-for-lab.md.
#
# ESO's own chart-installed ClusterRole already grants
# `serviceaccounts/token: create` cluster-wide (confirmed via
# `helm template external-secrets/external-secrets --version 2.8.0`), so no
# extra RBAC is needed on this ServiceAccount itself for ESO to request a
# token for it.
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   ("kubernetes" auth method: serviceAccountRef)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: secrets-demo
  annotations:
    # Sync wave "1": see namespace.yaml in this directory for rationale.
    argocd.argoproj.io/sync-wave: "1"
