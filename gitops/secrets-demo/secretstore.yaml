# SecretStore: Vault backend, Kubernetes auth method (no static Vault token
# ever stored as a Kubernetes Secret — ESO obtains a short-lived, audience-
# scoped token for `vault-auth` via the TokenRequest API and exchanges it
# with Vault's `auth/kubernetes/login` endpoint).
#
# server: in-cluster Service DNS name for the `vault` Helm release
# (confirmed via `helm template vault hashicorp/vault --version 0.34.0`:
# Service `vault` in namespace `vault`, port 8200). tls_disable is the
# chart default (dev-mode lab; see ADR-006) — plain http:// here matches.
#
# path/version: dev mode auto-mounts a kv-v2 secrets engine at "secret/"
# (developer.hashicorp.com/vault/docs/concepts/dev-server).
#
# mountPath/role/audiences: match the Vault-side `auth/kubernetes/role/eso`
# role created by the one-time bootstrap in README.md (never committed:
# that bootstrap needs the dev-mode root token, which is retrieved from pod
# logs at runtime only, never written to any file in this repo).
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   (SecretStore spec.provider.vault: server/path/version/auth.kubernetes;
#   default audience "vault" if unspecified — set explicitly here for
#   clarity; system:auth-delegator binding requirement, already satisfied
#   by the vault chart's default `server.authDelegator.enabled: true`)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: secrets-demo
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: Argo CD schema-validates (dry-run) every
    # resource in a sync operation up front, before honoring sync-wave order.
    # On first-ever sync, ESO's CRDs (SecretStore/ExternalSecret) don't exist
    # yet, so the dry-run for this resource fails and aborts the WHOLE
    # root-app sync — including wave "0" (vault/external-secrets Application
    # objects), which is why they never get created in the first place. This
    # option tells Argo CD to skip dry-run validation for resource types not
    # yet registered on the cluster, letting wave "0" run and install the
    # CRDs before wave "1" is applied for real.
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
