# SecretStore: Vault backend, Kubernetes auth method, same shape as
# gitops/data/postgres/secretstore.yaml (see that file and
# docs/adr/006-vault-dev-mode-for-lab.md for the full rationale on why
# Kubernetes auth, not a static token, is used).
#
# role: "backend" — a distinct Vault role from "postgres"/"redis"/"rabbitmq"/
# "kafka"/"eso", scoped (via scripts/bootstrap-vault.sh) to only the
# `secret/data/postgres`, `secret/data/redis`, `secret/data/rabbitmq`, and
# (Phase 6 batch 2) `secret/data/kafka` paths this service actually needs to
# read, and only the `vault-auth` ServiceAccount in this namespace, so a
# compromised backend pod cannot widen its own Vault access. Note the
# backend role reads the SAME Vault KV paths ("postgres", "redis",
# "rabbitmq", "kafka") already written by Phase 4/6's own directories — no
# new `vault kv put` needed here, only a policy/role binding scoped to this
# namespace's ServiceAccount.
#
# server/path/version: same Vault Service DNS name and kv-v2 mount as every
# other SecretStore in this repo (single Vault dev-mode instance for the
# whole lab).
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   (SecretStore spec.provider.vault: server/path/version/auth.kubernetes)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: apps
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see gitops/secrets-demo/secretstore.yaml
    # for the full rationale (CRD-then-CR ordering problem on first-ever
    # sync of the whole gitops/ tree).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "backend"
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
