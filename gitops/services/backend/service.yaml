# ClusterIP Service exposing backend in-cluster only — only the BFF (this
# same namespace) calls it; nothing outside the cluster needs to reach the
# backend directly.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: apps
  # `app: backend` here is a label on the Service OBJECT itself, distinct
  # from `spec.selector.app: backend` below (which only selects the Pods
  # this Service routes to). servicemonitor.yaml's `spec.selector.matchLabels`
  # matches against THIS metadata.labels field per the Prometheus Operator's
  # ServiceMonitor API reference ("Selector to select Endpoints objects by
  # corresponding Service labels" —
  # https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.ServiceMonitor).
  # Without it, the ServiceMonitor matches no Service in this namespace at
  # all (confirmed live: Prometheus enumerated every Service's endpoints in
  # `apps` and dropped all of them, backend included).
  labels:
    app: backend
  annotations:
    # Sync wave "2": grouped with deployment.yaml (both target the same
    # workload rollout).
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
