# ExternalSecret: pulls the credentials backend needs to reach Postgres,
# Redis, RabbitMQ, and (Phase 6 batch 2) Kafka from the SAME Vault kv-v2
# paths already written by scripts/bootstrap-vault.sh
# (gitops/data/postgres/README.md, gitops/data/redis/README.md,
# gitops/data/rabbitmq/README.md, gitops/data/kafka/README.md) — no new
# secret material is written to Vault for this service, only a new read
# path (backend's own SecretStore/role, see secretstore.yaml) and a
# differently-shaped target Secret. The KAFKA_USERNAME/KAFKA_PASSWORD pair
# read here from "secret/kafka" is the SAME credential that
# gitops/data/kafka/user.yaml's KafkaUser CR was told to use (via its own,
# separate ExternalSecret in that directory) — one Vault-sourced password,
# two Kubernetes Secrets (Strimzi's authentication source and this
# service's client config), by design (docs/adr/012).
#
# Unlike postgres/redis's ExternalSecrets (which template a
# kubernetes.io/basic-auth or Opaque secret consumed by an operator/
# Deployment field), this Secret is consumed directly as env vars by
# deployment.yaml via secretKeyRef — a plain Opaque Secret (ESO's default
# target type when `target.template` is omitted) is sufficient.
#
# refreshInterval: 1h — matches gitops/data/postgres/externalsecret.yaml;
# these credentials rotate rarely in this lab.
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-credentials
  namespace: apps
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see secretstore.yaml in this directory
    # for the full rationale (same CRD-then-CR ordering problem applies).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backend-credentials
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis
        property: password
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: rabbitmq
        property: password
    - secretKey: KAFKA_USERNAME
      remoteRef:
        key: kafka
        property: username
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: kafka
        property: password
