# Backend: orders/catalog API (docs/vision.md "Backend | Orders/catalog API
# (business logic)"), source at apps/backend/ (Phase 5, docs/phases.md,
# app-developer batch 1, PR #14). Talks to Postgres (transactional store)
# and Redis (catalog cache) directly; BFF/frontend never reach these data
# stores themselves (see gitops/services/README.md).
#
# image tag: pinned to the github.sha of the main commit that merged PR #16
# (the CI fix round), which is the first commit whose CI push job actually
# ran and succeeded end-to-end (build->test->scan->push) — confirmed live
# via `docker pull ghcr.io/alisson92/backend:ed1a6ca9...`. Tags are
# immutable per commit (service-ci.yml's `env.IMAGE` uses `github.sha`), so
# this must be bumped by hand to a new sha each time a future change to
# apps/backend/ merges to main and CI pushes a new image. NOTE (Phase 6
# batch 2): this PR again changes apps/backend/ (kafka.js, new
# @confluentinc/kafka-javascript dependency) but cannot know the merge
# commit's sha in advance — bumping this tag to the image CI actually
# pushes for this change is a required follow-up once this PR is merged,
# same pattern as Phase 5's and batch 1's post-merge tag-bump fixes.
#
# POSTGRES_HOST: CloudNativePG auto-creates a read-write Service named
# "<cluster-name>-rw" in the Cluster's namespace
# (https://cloudnative-pg.io/documentation/current/service_management/,
# "the read-write service ... <cluster name>-rw"); confirmed the cluster
# name is "postgres" in gitops/data/postgres/cluster.yaml
# (metadata.name: postgres, namespace: postgres), so the Service is
# "postgres-rw.postgres.svc.cluster.local".
#
# REDIS_HOST: confirmed against gitops/data/redis/service.yaml
# (metadata.name: redis, namespace: redis) -> "redis.redis.svc.cluster.local".
#
# RABBITMQ_HOST (Phase 6): confirmed against gitops/data/rabbitmq/
# service.yaml (metadata.name: rabbitmq, namespace: rabbitmq) ->
# "rabbitmq.rabbitmq.svc.cluster.local".
#
# KAFKA_HOST (Phase 6 batch 2): Strimzi auto-creates a bootstrap Service
# named "<Kafka CR name>-kafka-bootstrap" in the Kafka CR's namespace
# (confirmed live in this session against Strimzi's own docs/examples);
# gitops/data/kafka/cluster.yaml's Kafka CR is named "kafka" in namespace
# "kafka", so the Service is
# "kafka-kafka-bootstrap.kafka.svc.cluster.local", port 9092 (the "plain"
# SASL_PLAINTEXT/SCRAM-SHA-512 listener defined there).
#
# POSTGRES_DB: "orders", matching gitops/data/postgres/cluster.yaml's
# spec.bootstrap.initdb.database.
#
# securityContext.runAsNonRoot + runAsUser/runAsGroup: 1000 — the official
# node:22.23.2-alpine3.24 image (apps/backend/Dockerfile: `USER node`)
# creates the "node" user/group at uid/gid 1000
# (https://github.com/nodejs/docker-node/blob/main/docs/BestPractices.md,
# "Non-root user"; the image's Dockerfile:
# `groupadd --gid 1000 node && useradd --uid 1000 --gid node ... node`).
# Explicit uid/gid (not just runAsNonRoot: true) makes kubelet's admission
# check deterministic instead of relying on the image's default USER.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: apps
  annotations:
    # Sync wave "4" (Phase 6 batch 2 fix; was "2" before Kafka landed):
    # `apps/backend/src/index.js`'s main() calls `createKafkaProducer()`
    # unconditionally at startup (unlike the per-order publish in
    # orders.js/kafka.js, which is best-effort and swallows failures).
    # KafkaJS-compatible clients (confirmed against
    # @confluentinc/kafka-javascript's own docs, fetched live in this
    # session: https://docs.confluent.io/kafka-clients/javascript/current/migration.html)
    # throw non-retriably on a SASL/SCRAM authentication failure at
    # connect() — there is no lazy-connect option and connection-time auth
    # failures are not covered by the client's `retry` block (that only
    # covers Produce request retries). The broker only recognizes backend's
    # SCRAM credentials once gitops/data/kafka/user.yaml's KafkaUser CR
    # (wave "3") reconciles. Backend at the SAME wave as the Kafka broker
    # CRs (gitops/data/kafka/cluster.yaml, wave "2") would race that
    # KafkaUser and, per
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    # ("all resources in wave N must be healthy ... before Argo CD will
    # proceed to wave N+1"), a crash-looping backend at wave 2 would
    # permanently block wave 3 (the KafkaUser) from ever syncing —
    # deadlock, not a self-resolving race. Moving backend to wave "4"
    # (after the KafkaUser, wave "3") breaks the deadlock. Verified this
    # does not create a NEW ordering problem: bff's and frontend's own
    # `/health` readiness checks (gitops/services/bff/deployment.yaml,
    # gitops/services/frontend/deployment.yaml) do not call backend, so
    # nothing at wave "2" depends on backend being healthy at sync time.
    # Also consumes the "backend-credentials" Secret produced by
    # externalsecret.yaml (wave "1") and needs the postgres/redis Services
    # (already synced in Phase 4, unrelated wave numbering) to resolve.
    argocd.argoproj.io/sync-wave: "4"
    # SkipDryRunOnMissingResource: same first-ever-sync CRD-then-CR ordering
    # concern as gitops/data/postgres/cluster.yaml — this Deployment
    # references a Secret produced by an ExternalSecret CR that may not
    # exist yet at initial dry-run time.
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/alisson92/backend:ed1a6ca9210717a06bc79ebe83bce8ea8e93cbf6
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: POSTGRES_HOST
              value: "postgres-rw.postgres.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "orders"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: "redis.redis.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: REDIS_PASSWORD
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: RABBITMQ_PASSWORD
            - name: KAFKA_HOST
              value: "kafka-kafka-bootstrap.kafka.svc.cluster.local"
            - name: KAFKA_PORT
              value: "9092"
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-credentials
                  key: KAFKA_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          # Requests/limits mandatory per docs/conventions.md. Sized for a
          # single-instance lab service that exercises both a SQL connection
          # pool (Postgres) and a cache client (Redis) under light,
          # non-production traffic — the highest per-request load of the
          # four services, hence the largest request/limit among them.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
