# SecretStore: Vault backend, Kubernetes auth method, same shape as
# gitops/services/backend/secretstore.yaml (see that file and
# docs/adr/006-vault-dev-mode-for-lab.md for the full rationale).
#
# role: "worker" — a distinct Vault role from "backend", scoped (via
# scripts/bootstrap-vault.sh) to ONLY `secret/data/rabbitmq` — worker never
# touches Postgres or Redis directly (docs/vision.md: worker's whole job is
# consuming RabbitMQ messages to send email/invoice), so it gets no read
# access to those paths at all (least privilege).
#
# serviceAccountRef: "worker-vault-auth", not backend's "vault-auth" — see
# serviceaccount.yaml in this directory for why a distinct SA name is
# required for this scoping to actually hold.
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   (SecretStore spec.provider.vault: server/path/version/auth.kubernetes)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: apps
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see gitops/secrets-demo/secretstore.yaml
    # for the full rationale (CRD-then-CR ordering problem on first-ever
    # sync of the whole gitops/ tree).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "worker"
          serviceAccountRef:
            name: worker-vault-auth
            audiences:
              - vault
