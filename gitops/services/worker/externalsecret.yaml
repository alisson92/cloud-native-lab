# ExternalSecret: pulls the RabbitMQ credentials worker needs from the SAME
# Vault kv-v2 path already written by scripts/bootstrap-vault.sh
# (gitops/data/rabbitmq/README.md) — no new secret material is written to
# Vault for this service, only a new read path (worker's own SecretStore/
# role, see secretstore.yaml) scoped to that one path.
#
# refreshInterval: 1h — matches every other steady-state ExternalSecret in
# this repo (gitops/services/backend/externalsecret.yaml, gitops/data/
# redis/externalsecret.yaml).
#
# secretStoreRef.name: "vault-backend-worker" — this service's own
# SecretStore (see secretstore.yaml in this directory), not backend's
# "vault-backend". Both objects live in the shared "apps" namespace, so
# reusing backend's name would collide (namespace, kind, name) into a
# single object.
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-credentials
  namespace: apps
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see secretstore.yaml in this directory
    # for the full rationale (same CRD-then-CR ordering problem applies).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-worker
    kind: SecretStore
  target:
    name: worker-credentials
  data:
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: rabbitmq
        property: password
