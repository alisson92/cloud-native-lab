# ServiceAccount that External Secrets Operator impersonates (via the
# Kubernetes TokenRequest API) to authenticate to Vault's Kubernetes auth
# method. Same pattern as gitops/services/backend/serviceaccount.yaml — see
# docs/adr/006-vault-dev-mode-for-lab.md.
#
# name: "worker-vault-auth", NOT "vault-auth" — deliberately different from
# backend's ServiceAccount even though both live in the shared "apps"
# namespace (see gitops/services/README.md for why the namespace is
# shared). Vault's Kubernetes auth method binds a role to a
# (ServiceAccount name, ServiceAccount namespace) pair
# (https://developer.hashicorp.com/vault/docs/auth/kubernetes). If worker
# reused the name "vault-auth", its role and backend's role would both be
# bound to the exact same (name, namespace) pair, and anything able to
# request a token for that one ServiceAccount could log in as EITHER
# Vault role — defeating the least-privilege scoping this ServiceAccount
# exists to enforce (worker must only ever reach `secret/data/rabbitmq`,
# never `secret/data/postgres`/`secret/data/redis`). See
# scripts/bootstrap-vault.sh's "worker" role for the matching binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-vault-auth
  namespace: apps
  annotations:
    # Sync wave "1": see gitops/services/backend/namespace.yaml for the
    # "apps" Namespace's sync-wave rationale; this ServiceAccount depends on
    # that Namespace and on ESO's CRDs (external-secrets Application, wave
    # "0"), same as backend/serviceaccount.yaml.
    argocd.argoproj.io/sync-wave: "1"
