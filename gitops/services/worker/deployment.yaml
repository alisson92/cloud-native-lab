# Worker: Phase 6 (docs/phases.md) replaces the Phase 5 heartbeat loop with
# a real RabbitMQ consumer (apps/worker/src/rabbitmq.js,
# apps/worker/src/index.js) that consumes "orders.created" messages
# published by the backend (gitops/data/rabbitmq/) and logs a stubbed
# email/invoice action — no Service still, this workload has no HTTP
# surface to expose either way. See also this directory's own README.md.
#
# Namespace "apps" already created by gitops/services/backend/namespace.yaml
# — see that file's comment and gitops/services/README.md.
#
# image tag: pinned to the github.sha of the `main` commit
# 11d7e0342d0ff67af5b1a3459ea1ef062ad54c2e — the worker-ci push build
# (2026-08-03T13:45:45Z, run confirmed via `gh run list --workflow=worker-ci`,
# conclusion success, event push, branch main) that includes the real
# RabbitMQ consumer (apps/worker/src/rabbitmq.js, commit bd0f0d6, PR #23),
# replacing the Phase-5 heartbeat scaffold. This is a one-time manual
# backfill: the `bump-gitops` CI automation (ADR-013, PR #25) that now bumps
# this tag automatically on every push did not exist yet when this build ran,
# so the tag was left stale at the pre-Phase-6 sha (ed1a6ca9...), and the
# cluster kept running the old heartbeat-loop image until this fix —
# confirmed live via
# `docker pull ghcr.io/alisson92/worker:11d7e0342d0ff67af5b1a3459ea1ef062ad54c2e`
# (digest sha256:15758276536614a1a4b3dcc155366a75b68435fcf65e8a0a7f6edce7c1c4b190).
# Tags are immutable per commit (service-ci.yml's `env.IMAGE` uses
# `github.sha`); from this point on, `bump-gitops` (PR #25) handles future
# bumps automatically — no more manual backfills expected.
#
# RABBITMQ_HOST/PORT: same Service DNS name as gitops/services/backend/
# deployment.yaml's RABBITMQ_HOST comment (gitops/data/rabbitmq/
# service.yaml -> "rabbitmq.rabbitmq.svc.cluster.local").
#
# No containerPort: nothing listens (apps/worker/Dockerfile has no EXPOSE
# either), so none is declared here — an unused containerPort would be
# misleading, not informative.
#
# readinessProbe: exec `cat /tmp/ready`, mirroring the exact pattern already
# used by gitops/secrets-demo/deployment.yaml (same probe shape/timing) for
# a workload with no HTTP surface to probe. apps/worker/src/index.js now
# only writes /tmp/ready after the RabbitMQ connection/consumer is actually
# established, so this probe reflects real readiness to consume, not just
# process startup.
#
# securityContext.runAsUser/runAsGroup: 1000 — same official node image
# "node" user, see gitops/services/backend/deployment.yaml's comment for the
# doc-grounded uid/gid confirmation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: apps
  annotations:
    # Sync wave "2": after the "apps" Namespace (wave "1") and after
    # externalsecret.yaml in this directory (also wave "1", produces the
    # "worker-credentials" Secret this Deployment now consumes); grouped
    # with the other three services which also land in wave "2".
    argocd.argoproj.io/sync-wave: "2"
    # SkipDryRunOnMissingResource: same first-ever-sync CRD-then-CR ordering
    # concern as gitops/services/backend/deployment.yaml — this Deployment
    # references a Secret produced by an ExternalSecret CR that may not
    # exist yet at initial dry-run time.
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/alisson92/worker:11d7e0342d0ff67af5b1a3459ea1ef062ad54c2e
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: worker-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worker-credentials
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 2
            periodSeconds: 5
          # Requests/limits mandatory per docs/conventions.md. Smallest of
          # the four: one long-lived AMQP connection/channel, no HTTP
          # server, no Postgres/Redis client, light per-message CPU (a
          # stubbed log line, not real email/PDF rendering).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
