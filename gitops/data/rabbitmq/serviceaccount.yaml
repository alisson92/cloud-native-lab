# ServiceAccount that External Secrets Operator impersonates (via the
# Kubernetes TokenRequest API) to authenticate to Vault's Kubernetes auth
# method. Same pattern as gitops/data/redis/serviceaccount.yaml — see
# docs/adr/006-vault-dev-mode-for-lab.md.
#
# Note: this is the ESO-authentication identity, unrelated to the
# `rabbitmq` container's own runtime identity in deployment.yaml
# (securityContext.runAsUser).
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   ("kubernetes" auth method: serviceAccountRef)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: rabbitmq
  annotations:
    # Sync wave "1": see namespace.yaml in this directory for rationale.
    argocd.argoproj.io/sync-wave: "1"
