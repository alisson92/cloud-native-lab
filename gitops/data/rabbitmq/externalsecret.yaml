# ExternalSecret: pulls the RabbitMQ default-user credentials from Vault
# kv-v2 path "secret/rabbitmq" (written by scripts/bootstrap-vault.sh) into a
# Kubernetes Secret named "rabbitmq-credentials", consumed by
# deployment.yaml as RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS.
#
# refreshInterval: 1h — same reasoning as gitops/data/redis/
# externalsecret.yaml (steady-state operation, not fast manual-verification
# tuning like secrets-demo's 1m).
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: rabbitmq
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see secretstore.yaml in this directory
    # for the full rationale (same CRD-then-CR ordering problem applies).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: rabbitmq-credentials
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: rabbitmq
        property: username
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: rabbitmq
        property: password
