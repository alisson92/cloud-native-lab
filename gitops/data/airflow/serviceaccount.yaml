# ServiceAccount that External Secrets Operator impersonates (via the
# Kubernetes TokenRequest API) to authenticate to Vault's Kubernetes auth
# method. Same pattern as every other `gitops/data/*/serviceaccount.yaml`
# — see docs/adr/006-vault-dev-mode-for-lab.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: airflow
  annotations:
    # Sync wave "1": see namespace.yaml in this directory for rationale.
    argocd.argoproj.io/sync-wave: "1"
