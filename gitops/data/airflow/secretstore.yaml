# SecretStore: Vault backend, Kubernetes auth method, same shape as every
# other `gitops/data/*/secretstore.yaml` — see
# docs/adr/006-vault-dev-mode-for-lab.md.
#
# role: "airflow" — scoped (via scripts/bootstrap-vault.sh) to exactly
# three Vault KV paths this namespace's workload needs to read:
# `secret/data/airflow` (its own metadata-db role credential),
# `secret/data/airflow-kafka` (its own KafkaUser credential), and
# `secret/data/postgres` (read access to the "orders" application's own
# credential, reused for the DAG's read-only query against the orders
# table — see docs/adr/020-airflow-kafka-postgres-source-split.md for why
# no separate read-only Postgres role was introduced for this).
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   (SecretStore spec.provider.vault: server/path/version/auth.kubernetes)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: airflow
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see gitops/data/postgres/secretstore.yaml
    # for the full rationale (CRD-then-CR ordering problem on first-ever
    # sync of the whole gitops/ tree).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "airflow"
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
