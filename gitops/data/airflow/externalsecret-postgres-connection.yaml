# ExternalSecret: builds the Airflow Connection the sales-report DAG uses
# to read the "orders"/"products" tables (gitops/data/airflow/
# dags-configmap.yaml's PostgresHook, conn_id "orders_postgres").
#
# Reuses the SAME Vault kv-v2 path "secret/postgres" (the "orders"
# application-user credential, written by scripts/bootstrap-vault.sh —
# see gitops/data/postgres/README.md) rather than minting a new read-only
# Postgres role for Airflow — see
# docs/adr/020-airflow-kafka-postgres-source-split.md for why: the "orders"
# credential already only has DML rights on its own database, and this lab
# has no read-replica/reporting-role convention yet worth introducing for
# one nightly job.
#
# JSON connection format (not URI): the documented alternative
# (https://airflow.apache.org/docs/apache-airflow/stable/howto/connection.html,
# "Storing a Connection in Environment Variables", added in Airflow 2.3.0)
# — used here (not URI) purely because it is easier to read/audit in this
# file's Go-template than a URL-encoded connection string.
#
# Docs consulted:
# - https://external-secrets.io/latest/guides/templating/
#   (target.template.data)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-postgres-connection
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: airflow-postgres-connection
    template:
      data:
        connection: >-
          {"conn_type": "postgres", "login": "{{ .username }}",
          "password": "{{ .password }}",
          "host": "postgres-rw.postgres.svc.cluster.local", "port": 5432,
          "schema": "orders"}
  data:
    - secretKey: username
      remoteRef:
        key: postgres
        property: username
    - secretKey: password
      remoteRef:
        key: postgres
        property: password
