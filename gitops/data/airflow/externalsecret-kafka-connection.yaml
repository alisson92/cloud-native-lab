# ExternalSecret: builds the Airflow Kafka Connection the sales-report DAG
# uses to consume "order-events" (gitops/data/airflow/dags-configmap.yaml's
# ConsumeFromTopicOperator, kafka_config_id "kafka_default").
#
# Sourced from a NEW, dedicated Vault kv-v2 path "secret/airflow-kafka"
# (written by scripts/bootstrap-vault.sh) — a distinct credential from
# backend's "secret/kafka", backing the distinct, read-only "airflow"
# KafkaUser (gitops/data/kafka/airflow-user.yaml), per this repo's own
# precedent recorded in docs/adr/015-kafka-gate-verifier-user.md's
# Consequences ("Phase 7's Airflow ETL gets its own Vault-sourced
# KafkaUser... a real, long-lived workload credential").
#
# JSON connection format
# (https://airflow.apache.org/docs/apache-airflow/stable/howto/connection.html):
# `extra` carries every librdkafka config key the apache-kafka provider's
# hook passes straight through to confluent-kafka
# (https://airflow.apache.org/docs/apache-airflow-providers-apache-kafka/stable/connections/kafka.html,
# "Most operators and hooks will check that at the minimum the
# `bootstrap.servers` key exists").
#
# `sasl.mechanism`/`security.protocol`: matches
# gitops/data/kafka/cluster.yaml's listener (SASL_PLAINTEXT,
# SCRAM-SHA-512) — same values apps/backend/src/kafka.js's producer uses.
#
# `group.id`: "airflow-sales-report" — a single fixed, literal consumer
# group id, matching the exact group name
# gitops/data/kafka/airflow-user.yaml's KafkaUser ACLs grant Read on (least
# privilege: this identity can only join this one named group, same
# reasoning as gitops/data/kafka/gate-verifier-user.yaml before it).
#
# `enable.auto.commit: "false"`: required for `commit_cadence` to be
# respected — the operator's own docstring/runtime warning says so
# explicitly (confirmed by reading
# airflow.providers.apache.kafka.operators.consume.ConsumeFromTopicOperator
# 1.15.0's source in this session: `_validate_commit_cadence_before_execute`
# logs a warning whenever `commit_cadence` is set but
# `enable.auto.commit` is not explicitly "false").
#
# `auto.offset.reset: "earliest"`: librdkafka's own default for a BRAND
# NEW consumer group (no committed offset yet) is "latest" — this group id
# ("airflow-sales-report") has never consumed before, so without this
# override the very first DAG run would skip every "order.created" event
# already sitting in the topic from Phase 5/6 verification and see zero
# messages, undermining the Phase 7 exit gate ("a nightly DAG run produces
# a report", docs/phases.md). Confirmed default via
# https://github.com/confluentinc/librdkafka/blob/master/CONFIGURATION.md
# (`auto.offset.reset`: "Action to take when there is no initial offset...
# default: latest").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-kafka-connection
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: airflow-kafka-connection
    template:
      data:
        connection: >-
          {"conn_type": "kafka", "extra": {
          "bootstrap.servers": "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092",
          "security.protocol": "SASL_PLAINTEXT",
          "sasl.mechanism": "SCRAM-SHA-512",
          "sasl.username": "{{ .username }}",
          "sasl.password": "{{ .password }}",
          "group.id": "airflow-sales-report",
          "enable.auto.commit": "false",
          "auto.offset.reset": "earliest"} }
  data:
    - secretKey: username
      remoteRef:
        key: airflow-kafka
        property: username
    - secretKey: password
      remoteRef:
        key: airflow-kafka
        property: password
