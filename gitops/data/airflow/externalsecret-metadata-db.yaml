# ExternalSecret: builds the Airflow metadata-database connection string
# consumed by gitops/apps/airflow.yaml's `data.metadataSecretName`.
#
# Combines the "airflow" Postgres role's credentials (Vault kv-v2 path
# "secret/airflow", written by scripts/bootstrap-vault.sh — the SAME
# credential gitops/data/postgres/cluster.yaml's `spec.managed.roles`
# entry and gitops/data/postgres/airflow-role-externalsecret.yaml use to
# create that role) with the fixed, non-secret connection details (host,
# port, database name) via ESO's Go-template `target.template.data`
# mechanism, into a single `connection` key — the exact shape the chart
# requires: "secret itself has to be created manually with 'connection'
# key ... base64-encoded SQLAlchemy connection string, e.g.
# postgresql+psycopg2://airflow:password@postgres/airflow"
# (https://raw.githubusercontent.com/apache/airflow/helm-chart/1.22.0/chart/values.yaml,
# `data.metadataSecretName` comment).
#
# Host: CloudNativePG's read-write Service naming convention
# ("<cluster-name>-rw"), same derivation already used by
# gitops/services/backend/deployment.yaml — cluster name "postgres" in
# namespace "postgres" (gitops/data/postgres/cluster.yaml) ->
# "postgres-rw.postgres.svc.cluster.local".
# https://cloudnative-pg.io/documentation/current/service_management/
#
# Database name "airflow": matches
# gitops/data/postgres/airflow-database.yaml's `spec.name`.
#
# Docs consulted:
# - https://external-secrets.io/latest/guides/templating/
#   (target.template.data Go-template syntax referencing data[].secretKey
#   values as `{{ .keyName }}`)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata-db-credentials
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: airflow-metadata-db-credentials
    template:
      data:
        connection: "postgresql+psycopg2://{{ .username }}:{{ .password }}@postgres-rw.postgres.svc.cluster.local:5432/airflow"
  data:
    - secretKey: username
      remoteRef:
        key: airflow
        property: username
    - secretKey: password
      remoteRef:
        key: airflow
        property: password
