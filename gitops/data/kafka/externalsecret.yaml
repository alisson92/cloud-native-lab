# ExternalSecret: pulls the "backend" Kafka user's SCRAM-SHA-512 password
# from Vault kv-v2 path "secret/kafka" (written by
# scripts/bootstrap-vault.sh) into a Kubernetes Secret named
# "kafka-app-credentials" — the "pre-existing Secret" that kafkauser.yaml's
# spec.authentication.password.valueFrom.secretKeyRef references, per
# docs/adr/012-kafka-strimzi-kraft-and-vault-user.md. Also templates
# "username" for parity with backend's own ExternalSecret in
# gitops/services/backend/, even though Strimzi itself never reads the
# "username" key (the KafkaUser's username is always its own
# metadata.name; see kafkauser.yaml's header comment).
#
# Unlike Postgres/RabbitMQ, Strimzi's User Operator does NOT generate or
# manage this Secret's contents when a password.valueFrom is used — it only
# reads the key named here. This ExternalSecret (not Strimzi) is this
# Secret's sole owner, same pattern as every other ExternalSecret-produced
# Secret in this repo.
#
# refreshInterval: 1h — matches gitops/data/postgres/externalsecret.yaml;
# this credential rotates rarely in this lab.
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-app-credentials
  namespace: kafka
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see secretstore.yaml in this directory
    # for the full rationale (same CRD-then-CR ordering problem applies).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: kafka-app-credentials
  data:
    - secretKey: username
      remoteRef:
        key: kafka
        property: username
    - secretKey: password
      remoteRef:
        key: kafka
        property: password
