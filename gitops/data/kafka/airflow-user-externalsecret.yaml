# ExternalSecret: pulls the "airflow" Kafka user's SCRAM-SHA-512 password
# from Vault kv-v2 path "secret/airflow-kafka" (written by
# scripts/bootstrap-vault.sh) into a Kubernetes Secret named
# "airflow-kafka-credentials" — the pre-existing Secret
# airflow-user.yaml's `spec.authentication.password.valueFrom.secretKeyRef`
# references, following user.yaml's own "backend" pattern exactly
# (ADR-012), per docs/adr/015-kafka-gate-verifier-user.md's Consequences
# ("Phase 7's Airflow ETL gets its own, Vault-sourced KafkaUser... a real,
# long-lived workload credential").
#
# Distinct Vault path from "secret/kafka" (backend's producer credential):
# this is a separate identity with separate, narrower (read-only) ACLs —
# see airflow-user.yaml.
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-kafka-credentials
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: airflow-kafka-credentials
  data:
    - secretKey: username
      remoteRef:
        key: airflow-kafka
        property: username
    - secretKey: password
      remoteRef:
        key: airflow-kafka
        property: password
