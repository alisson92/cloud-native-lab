# ExternalSecret: pulls the Postgres application-user credentials from
# Vault kv-v2 path "secret/postgres" (written by the one-time bootstrap in
# README.md) into a Kubernetes Secret named "postgres-app-credentials",
# consumed by cluster.yaml's `spec.bootstrap.initdb.secret`.
#
# target.template.type: kubernetes.io/basic-auth — CloudNativePG's initdb
# bootstrap requires the referenced secret to comply with the Kubernetes
# basic-auth secret type (username/password keys), matching the type
# CloudNativePG itself uses for auto-generated credentials.
# https://cloudnative-pg.io/documentation/current/bootstrap/
# ("Passing a secret" / secret must be of type kubernetes.io/basic-auth)
#
# refreshInterval: 1h — credentials rotate rarely in this lab; shorter than
# secrets-demo's 1m (that one is tuned for fast manual verification, not
# steady-state operation).
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
# - https://external-secrets.io/latest/guides/common-k8s-secret-types/
#   (target.template.type for well-known Kubernetes Secret types)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: postgres
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see secretstore.yaml in this directory
    # for the full rationale (same CRD-then-CR ordering problem applies).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgres-app-credentials
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: postgres
        property: username
    - secretKey: password
      remoteRef:
        key: postgres
        property: password
