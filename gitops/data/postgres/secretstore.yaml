# SecretStore: Vault backend, Kubernetes auth method, same shape as
# gitops/secrets-demo/secretstore.yaml (see that file and
# docs/adr/006-vault-dev-mode-for-lab.md for the full rationale on why
# Kubernetes auth, not a static token, is used).
#
# role: "postgres" — a distinct Vault role from secrets-demo's "eso" role,
# scoped (via the one-time bootstrap in README.md) to only the
# `secret/data/postgres` path and only the `vault-auth` ServiceAccount in
# this namespace, so a compromised postgres workload cannot read the redis
# or secrets-demo Vault paths.
#
# server/path/version: same Vault Service DNS name and kv-v2 mount as
# secrets-demo/secretstore.yaml (single Vault dev-mode instance for the
# whole lab).
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   (SecretStore spec.provider.vault: server/path/version/auth.kubernetes)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: postgres
  annotations:
    # Sync wave "1": requires ESO's CRDs (installed by the external-secrets
    # Application, wave "0") to already exist. See namespace.yaml in this
    # directory for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: see gitops/secrets-demo/secretstore.yaml
    # for the full rationale (CRD-then-CR ordering problem on first-ever
    # sync of the whole gitops/ tree).
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "postgres"
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
