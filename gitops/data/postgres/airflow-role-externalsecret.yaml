# ExternalSecret: pulls the "airflow" Postgres role's credentials from
# Vault kv-v2 path "secret/airflow" (written by scripts/bootstrap-vault.sh
# — the SAME path gitops/data/airflow/externalsecret-metadata-db.yaml
# reads to build Airflow's own connection string) into a
# kubernetes.io/basic-auth Secret in THIS namespace, consumed by
# cluster.yaml's `spec.managed.roles[].passwordSecret`.
#
# Why this lives in `postgres`, not `airflow`: CloudNativePG's declarative
# role management requires `passwordSecret` to reference a Secret in the
# SAME namespace as the Cluster CR
# (https://cloudnative-pg.io/docs/1.27/declarative_role_management/) —
# same colocation constraint `bootstrap.initdb.secret` already has on
# `externalsecret.yaml` in this directory. One Vault KV path, two
# ExternalSecrets in two namespaces, same pattern this repo already uses
# for `secret/kafka` (kafka namespace's own ExternalSecret AND
# gitops/services/backend's) and `secret/postgres` (this directory's own
# ExternalSecret AND gitops/data/airflow's
# externalsecret-postgres-connection.yaml).
#
# This is why postgres/'s own SecretStore role ("postgres") needs read
# access to `secret/data/airflow` too — see scripts/bootstrap-vault.sh's
# "postgres" block for the extended `postgres-read` policy.
#
# Docs consulted:
# - https://external-secrets.io/latest/introduction/getting-started/
#   (ExternalSecret spec: secretStoreRef, target, data[].secretKey/remoteRef)
# - https://external-secrets.io/latest/guides/common-k8s-secret-types/
#   (target.template.type for kubernetes.io/basic-auth)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-postgres-role-credentials
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: airflow-postgres-role-credentials
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: airflow
        property: username
    - secretKey: password
      remoteRef:
        key: airflow
        property: password
