# CloudNativePG Cluster: single-instance PostgreSQL for the "orders"
# transactional store (docs/vision.md: "PostgreSQL | Transactional store
# for orders"). See docs/adr/008-postgres-operator-proportionality.md for
# why the operator (not a hand-rolled StatefulSet) was kept for this lab.
#
# instances: 1 — no HA (docs/vision.md non-goal: "High availability and
# multi-region setups"); this is an ephemeral lab (ADR-004), not a
# durability guarantee.
#
# storage.size: 1Gi — small, cost-disciplined default for a lab dataset;
# no storageClassName set, so the cluster's default StorageClass is used
# (Kind's local-path-provisioner), matching docs/conventions.md's
# preference for defaults over custom tuning without a measured reason.
#
# resources: requests/limits mandatory per docs/conventions.md. Sized for a
# single-instance lab Postgres with light, non-production traffic.
#
# bootstrap.initdb.owner MUST match the "username" value written to Vault
# at "secret/postgres" by the one-time bootstrap in README.md (documented
# there as "orders") — CloudNativePG requires this match to apply the
# secret's password to that owner. secret.name references the Kubernetes
# Secret produced by externalsecret.yaml (type kubernetes.io/basic-auth,
# required by this bootstrap method).
#
# spec.managed.roles (Phase 7): a second, narrower role "airflow" in this
# SAME cluster, backing a NEW "airflow" Database (airflow-database.yaml) —
# docs/adr/019-airflow-metadata-db-shared-cluster.md decided reuse over a
# second CloudNativePG Cluster (this single-node Kind host has no spare
# capacity for another Postgres instance). `passwordSecret.name` follows
# the exact same rule as `bootstrap.initdb.secret` above: a
# kubernetes.io/basic-auth Secret whose `username` key matches the role
# `name` ("the username should match the role we are setting the password
# for") — produced by airflow-role-externalsecret.yaml (wave "1", same
# Vault kv-v2 path "secret/airflow" that
# gitops/data/airflow/externalsecret-metadata-db.yaml also reads). Role
# creation happens as an ongoing reconciliation, "after database
# bootstrapping is complete" — safe to declare from this Cluster's first
# sync onward, not just on a freshly-bootstrapped one.
#
# Docs consulted:
# - https://cloudnative-pg.io/documentation/current/bootstrap/
#   (bootstrap.initdb: database/owner/secret.name; secret must be
#   kubernetes.io/basic-auth with the owner's username matching)
# - https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/
#   (spec.instances, spec.storage.size, spec.resources use core/v1
#   ResourceRequirements)
# - https://cloudnative-pg.io/docs/1.27/declarative_role_management/
#   (spec.managed.roles: name/ensure/login/passwordSecret.name; password
#   Secret type kubernetes.io/basic-auth, username must match role name;
#   role creation deferred until after database bootstrapping)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
  annotations:
    # Sync wave "2": after the operator/CRDs (wave "0") and the
    # ExternalSecret-produced credentials Secret (wave "1") this Cluster's
    # bootstrap depends on.
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "2"
    # SkipDryRunOnMissingResource: same first-ever-sync CRD-then-CR ordering
    # problem documented in gitops/secrets-demo/secretstore.yaml — on a
    # fresh cluster, Argo CD dry-run-validates every resource in the sync
    # operation up front, before wave "0" (which installs the
    # postgresql.cnpg.io CRDs) has actually run.
    # Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (section: "Skip Dry Run for new custom resources types")
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1

  storage:
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrap:
    initdb:
      database: orders
      owner: orders
      secret:
        name: postgres-app-credentials

  managed:
    roles:
      - name: airflow
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: airflow-postgres-role-credentials
