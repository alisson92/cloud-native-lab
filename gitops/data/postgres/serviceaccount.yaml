# ServiceAccount that External Secrets Operator impersonates (via the
# Kubernetes TokenRequest API) to authenticate to Vault's Kubernetes auth
# method. Same pattern as gitops/secrets-demo/serviceaccount.yaml — see
# docs/adr/006-vault-dev-mode-for-lab.md for why Kubernetes auth (not a
# static Vault token) is used.
#
# ESO's chart-installed ClusterRole already grants
# `serviceaccounts/token: create` cluster-wide (confirmed via
# `helm template external-secrets/external-secrets --version 2.8.0` in
# Phase 3), so no extra RBAC is needed on this ServiceAccount itself.
#
# Docs consulted:
# - https://external-secrets.io/latest/provider/hashicorp-vault/
#   ("kubernetes" auth method: serviceAccountRef)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: postgres
  annotations:
    # Sync wave "1": see namespace.yaml in this directory for rationale.
    argocd.argoproj.io/sync-wave: "1"
