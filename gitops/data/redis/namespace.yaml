# Namespace for Redis (Phase 4, docs/phases.md), used as catalog cache and
# sessions (docs/vision.md). Plain Deployment, not an operator — see
# docs/adr/007-redis-plain-deployment.md.
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  annotations:
    # Sync wave "1": applied after the external-secrets Application
    # (wave "0") so ESO's CRDs already exist when secretstore.yaml/
    # externalsecret.yaml in this directory sync.
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "1"
