# ClusterIP Service exposing Redis in-cluster only (no external access
# needed — only the backend service, added in Phase 5, connects to it).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  annotations:
    # Sync wave "2": grouped with deployment.yaml (both target the same
    # workload rollout).
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
