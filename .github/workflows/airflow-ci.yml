# CI for the custom Airflow image (apps/airflow/Dockerfile, Phase 7).
#
# Deliberately NOT reusing service-ci.yml (.github/workflows/service-ci.yml):
# that reusable workflow's `test` job runs `npm ci && npm test`, which does
# not apply here (this image has no application source, only a Dockerfile
# adding one pip package to the official Airflow image) — reusing it would
# mean either fabricating a no-op Node test step or bending the reusable
# workflow's inputs to skip a job, both against docs/conventions.md's
# simplicity principle. A short, dedicated workflow is the simplest fit.
#
# Also includes a `bump-gitops` job (contrast with the original version of
# this file, which left this manual — see git history / TASKS.md): unlike
# service-ci.yml's `image:` line in a plain Deployment manifest,
# gitops/apps/airflow.yaml pins the tag inside a nested Helm `valuesObject`
# field (`images.airflow.tag`), so service-ci.yml's bump-gitops `sed`
# pattern (keyed on an `image: ghcr.io/...` line) does not match here.
# Instead this job's sed is keyed on the `tag: "..."` line, which is unique
# in this file (verified in this session: `grep -n 'tag:'
# gitops/apps/airflow.yaml` returns exactly one match) — a minimal,
# single-line diff. A YAML-aware rewrite with `yq` (pre-installed on
# GitHub-hosted runners) was tried and rejected: mikefarah/yq's `-i`
# re-serializes the whole document and drops every blank line in the file
# (verified in this session — a 285-line file with ~13 blank lines came back
# blank-line-free), producing a noisy, hard-to-review diff across the entire
# values block on every bump PR instead of the one line that actually
# changed.
#
# Actions/versions match service-ci.yml's own pins, verified against the
# same GitHub release pages in this session:
#   - docker/setup-buildx-action@v4.2.0
#   - docker/build-push-action@v7.3.0
#   - actions/upload-artifact@v7.0.1 / actions/download-artifact@v8.0.1
#   - aquasecurity/trivy-action@v0.36.0
#   - docker/login-action@v4.6.0
#   - gh CLI (pre-installed on GitHub-hosted runners): `gh pr list --head`,
#     `gh pr create --head/--base/--title/--body`, `gh pr edit` — flags
#     confirmed against cli.github.com/manual/gh_pr_create and gh_pr_list.
name: airflow-ci

on:
  push:
    branches: [main]
    paths: ["apps/airflow/**"]
  pull_request:
    paths: ["apps/airflow/**"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/airflow:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: apps/airflow
          tags: ${{ env.IMAGE }}
          load: true
          push: false
      - run: docker save "${{ env.IMAGE }}" -o /tmp/airflow.tar
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: airflow-image
          path: /tmp/airflow.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: airflow-image
          path: /tmp
      - run: docker load -i /tmp/airflow.tar
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # apps/airflow/Dockerfile (see its header comment and
          # docs/adr/021-airflow-slim-base-image.md) closes every CVE this
          # gate found except a handful of bundled binaries the official
          # apache/airflow image ships but never executes at runtime:
          #   - GHSA-4w2j-m93h-cj5j (quinn-proto), in the `uv`/`uvx`
          #     Python-packaging binaries at these 4 paths.
          #   - 3 Go stdlib CVEs (crypto/x509, os, mime — DoS/symlink
          #     issues) in usr/bin/docker, the Docker CLI binary the base
          #     image bundles (present on both the default and `slim`
          #     tags, confirmed in this session; unrelated to this
          #     project's `apache-airflow-providers-docker`, which is not
          #     installed here and talks to the Docker socket via its own
          #     Python SDK, not this CLI).
          # Confirmed in this session (`cat /entrypoint`) that none of
          # `uv`/`uvx`/`prek`/`docker` are ever invoked by the image's own
          # startup script — they sit on PATH as build/dev conveniences
          # only, never called by the running
          # webserver/scheduler/dag-processor/api-server — so this is the
          # same class of upstream-base-image-bundled-but-unexercised
          # tooling as service-ci.yml's node:22-alpine/npm precedent
          # (docs/phase-logs/phase-5.md), not part of this image's actual
          # attack surface.
          skip-files: /home/airflow/.local/bin/uv,/home/airflow/.local/bin/uvx,/home/airflow/.local/share/uv/tools/prek/bin/uv,/home/airflow/.local/share/uv/tools/prek/bin/uvx,/usr/bin/docker

  push:
    needs: [build, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: airflow-image
          path: /tmp
      - run: docker load -i /tmp/airflow.tar
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ env.IMAGE }}"

  # Opens/updates a PR bumping gitops/apps/airflow.yaml's
  # images.airflow.tag to the sha `push` just published. Never merges
  # (human gate, see CLAUDE.md and ADR-013) — only creates or updates the
  # PR. Adapted from service-ci.yml's `bump-gitops` job (ADR-013); this
  # workflow is not a reusable `workflow_call` like service-ci.yml, so
  # "airflow" is hardcoded throughout instead of taking it as an input.
  #
  # `if:` mirrors `push`'s own condition rather than relying solely on
  # `needs: push`: a job whose own dependency was *skipped* (not failed)
  # still runs by default in GitHub Actions, so without this explicit guard
  # a pull_request-triggered run (where `push` skips) would still attempt to
  # run this job. Belt-and-braces with `push`'s guard, not a substitute for
  # it.
  bump-gitops:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Overrides the workflow-level `packages: write` for this job only:
      # this job needs repo contents write (to push the bump branch) and
      # pull-requests write (to open/edit the PR), not registry access.
      # Docs: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
      contents: write
      pull-requests: write
    env:
      NEW_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: bump
        name: Bump image tag in gitops manifest
        run: |
          set -euo pipefail
          FILE="gitops/apps/airflow.yaml"
          BRANCH="ci/bump-airflow-image"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # gitops/apps/airflow.yaml pins the tag inside a nested Helm
          # valuesObject field (images.airflow.tag), not a plain `image:`
          # line like the per-service deployment.yaml files service-ci.yml
          # bumps — this sed is keyed on the `tag: "..."` line instead,
          # which is the only "tag:" line in this file (see this workflow's
          # header comment for why a YAML-aware `yq` rewrite was rejected).
          # Matches both the initial "REPLACE_WITH_PUSHED_SHA" placeholder
          # and any subsequent real sha identically — plain substring
          # replacement, no special-casing needed.
          sed -i -E "s#(tag: \").*(\")#\1${NEW_SHA}\2#" "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "Image tag already at ${NEW_SHA}; nothing to bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$FILE"
          git commit -m "chore(gitops): bump airflow image to ${NEW_SHA}"
          # Stable, predictable branch name, force-pushed each run so
          # repeated CI runs update the same branch/PR instead of piling up
          # duplicates (same convention as service-ci.yml's bump-gitops).
          git push --force origin "HEAD:${BRANCH}"
      - name: Open or update pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          TITLE="chore(gitops): bump airflow image to ${NEW_SHA}"
          BODY=$(printf 'Automated image tag bump for `airflow` to the image `ghcr.io/%s/airflow:%s` just built and pushed by this CI run.\n\nOpened automatically by the bump-gitops job in airflow-ci.yml (see ADR-013). This does not bypass the human merge gate: review the diff and merge manually to let Argo CD reconcile the new image.\n' "${{ github.repository_owner }}" "$NEW_SHA")

          # gh pr list --head/gh pr create/gh pr edit flags confirmed against
          # https://cli.github.com/manual/gh_pr_list and gh_pr_create.
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
