# Reusable CI pipeline for a single apps/<service>. Called by the four
# per-service workflows (backend-ci.yml, bff-ci.yml, frontend-ci.yml,
# worker-ci.yml), each parameterizing `service` and `path`.
#
# Pipeline order: build -> test -> scan -> push. The image is built once
# (build), exported as a tar artifact via `docker save`, and reloaded by
# `scan` and `push` — each GitHub Actions job runs on a fresh runner with no
# shared Docker daemon, so passing the image forward avoids rebuilding it.
#
# Actions and pinned versions verified against their GitHub release pages in
# this session (2026-08-02):
#   - docker/setup-buildx-action@v4.2.0
#   - docker/build-push-action@v7.3.0 (github.com/docker/build-push-action)
#   - actions/setup-node@v4 (per task spec; still an actively maintained major)
#   - actions/upload-artifact@v7.0.1 / actions/download-artifact@v8.0.1
#   - aquasecurity/trivy-action@v0.36.0 (github.com/aquasecurity/trivy-action)
#   - docker/login-action@v4.6.0 (github.com/docker/login-action)
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      path:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.path }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
      - run: docker save "${{ env.IMAGE }}" -o /tmp/${{ inputs.service }}.tar
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.service }}-image
          path: /tmp/${{ inputs.service }}.tar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: ${{ inputs.path }}
        run: |
          npm ci
          npm test

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.service }}-image
          path: /tmp
      - run: docker load -i /tmp/${{ inputs.service }}.tar
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # The node:22-alpine base image bundles npm's own global install
          # under /usr/local/lib/node_modules/npm — its transitive deps
          # (own copy of tar, sigstore, etc.) are never invoked at runtime
          # (CMD is `node src/index.js`, npm is not run in the container),
          # so CVEs found only there are not part of this image's actual
          # attack surface. Scoping the scan to the app's own code/deps
          # avoids failing the gate on findings this project cannot fix
          # (they belong to the upstream Node image's bundled npm).
          skip-dirs: /usr/local/lib/node_modules/npm

  push:
    needs: [build, test, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.service }}-image
          path: /tmp
      - run: docker load -i /tmp/${{ inputs.service }}.tar
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ env.IMAGE }}"
