# Reusable CI pipeline for a single apps/<service>. Called by the four
# per-service workflows (backend-ci.yml, bff-ci.yml, frontend-ci.yml,
# worker-ci.yml), each parameterizing `service` and `path`.
#
# Pipeline order: build -> test -> scan -> push -> bump-gitops. The image is
# built once (build), exported as a tar artifact via `docker save`, and
# reloaded by `scan` and `push` — each GitHub Actions job runs on a fresh
# runner with no shared Docker daemon, so passing the image forward avoids
# rebuilding it.
#
# bump-gitops (added 2026-08-03, see ADR-013): after `push` lands a new image
# on `main`, this job edits gitops/services/<service>/deployment.yaml's
# `image:` tag to the just-pushed github.sha and opens a PR with that single
# change — it never merges. This automates the manual tag-bump that already
# caused stale-image follow-up work after Phase 5 (PR #17) and Phase 6
# (see TASKS.md). It never runs for pull_request events (github.ref is the
# PR's merge ref there, not refs/heads/main, so both `push`'s and
# `bump-gitops`'s `if:` are false) — only a trusted push to `main` can ever
# trigger it, so this cannot be reached from a fork's pull_request context.
#
# Actions and pinned versions verified against their GitHub release pages in
# this session (2026-08-02, gh CLI usage re-verified 2026-08-03):
#   - docker/setup-buildx-action@v4.2.0
#   - docker/build-push-action@v7.3.0 (github.com/docker/build-push-action)
#   - actions/setup-node@v4 (per task spec; still an actively maintained major)
#   - actions/upload-artifact@v7.0.1 / actions/download-artifact@v8.0.1
#   - aquasecurity/trivy-action@v0.36.0 (github.com/aquasecurity/trivy-action)
#   - docker/login-action@v4.6.0 (github.com/docker/login-action)
#   - gh CLI (pre-installed on GitHub-hosted runners): `gh pr list --head`,
#     `gh pr create --head/--base/--title/--body`, `gh pr edit` — flags
#     confirmed against cli.github.com/manual/gh_pr_create and gh_pr_list.
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      path:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.path }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
      - run: docker save "${{ env.IMAGE }}" -o /tmp/${{ inputs.service }}.tar
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.service }}-image
          path: /tmp/${{ inputs.service }}.tar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: ${{ inputs.path }}
        run: |
          npm ci
          npm test

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.service }}-image
          path: /tmp
      - run: docker load -i /tmp/${{ inputs.service }}.tar
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # The node:22-alpine base image bundles npm's own global install
          # under /usr/local/lib/node_modules/npm — its transitive deps
          # (own copy of tar, sigstore, etc.) are never invoked at runtime
          # (CMD is `node src/index.js`, npm is not run in the container),
          # so CVEs found only there are not part of this image's actual
          # attack surface. Scoping the scan to the app's own code/deps
          # avoids failing the gate on findings this project cannot fix
          # (they belong to the upstream Node image's bundled npm).
          skip-dirs: /usr/local/lib/node_modules/npm

  push:
    needs: [build, test, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.service }}-image
          path: /tmp
      - run: docker load -i /tmp/${{ inputs.service }}.tar
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ env.IMAGE }}"

  # Opens/updates a PR bumping gitops/services/<service>/deployment.yaml's
  # image tag to the sha `push` just published. Never merges (human gate,
  # see CLAUDE.md and ADR-013) — only creates or updates the PR.
  #
  # `if:` mirrors `push`'s own condition rather than relying solely on
  # `needs: push`: a job whose own dependency was *skipped* (not failed)
  # still runs by default in GitHub Actions, so without this explicit guard
  # a pull_request-triggered run (where `push` skips) would still attempt to
  # run this job. Belt-and-braces with `push`'s guard, not a substitute for
  # it.
  bump-gitops:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Overrides the workflow-level `packages: write` for this job only:
      # this job needs repo contents write (to push the bump branch) and
      # pull-requests write (to open/edit the PR), not registry access.
      # Docs: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
      contents: write
      pull-requests: write
    env:
      SERVICE: ${{ inputs.service }}
      NEW_SHA: ${{ github.sha }}
      REPO_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: bump
        name: Bump image tag in gitops manifest
        run: |
          set -euo pipefail
          FILE="gitops/services/${SERVICE}/deployment.yaml"
          BRANCH="ci/bump-${SERVICE}-image"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          sed -i -E "s#(image: ghcr\.io/${REPO_OWNER}/${SERVICE}:).*#\1${NEW_SHA}#" "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "Image tag already at ${NEW_SHA}; nothing to bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$FILE"
          git commit -m "chore(gitops): bump ${SERVICE} image to ${NEW_SHA}"
          # Stable, predictable branch name per service, force-pushed each
          # run (task requirement #2) so repeated CI runs update the same
          # branch/PR instead of piling up duplicates.
          git push --force origin "HEAD:${BRANCH}"
      - name: Open or update pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          TITLE="chore(gitops): bump ${SERVICE} image to ${NEW_SHA}"
          BODY=$(printf 'Automated image tag bump for `%s` to the image `ghcr.io/%s/%s:%s` just built and pushed by this CI run.\n\nOpened automatically by the bump-gitops job in service-ci.yml (see ADR-013). This does not bypass the human merge gate: review the diff and merge manually to let Argo CD reconcile the new image.\n' "$SERVICE" "$REPO_OWNER" "$SERVICE" "$NEW_SHA")

          # gh pr list --head/gh pr create/gh pr edit flags confirmed against
          # https://cli.github.com/manual/gh_pr_list and gh_pr_create.
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
